# Protect the physical server tree on every virtual host, not only the Lorkhan port.
<Directory /var/www/html/LorkhanServer>
    Options -Indexes -ExecCGI +FollowSymLinks
    AllowOverride None
    Require all denied
</Directory>

# PHP includes remain available; direct HTTP requests to internal directories do not.
<DirectoryMatch "^/var/www/html/LorkhanServer/(?:conf|lib|data|service|processor|connector|tts|stt|prompts|deploy|scripts|protocol|storage|vendor|tests|docs|build|\.git)(?:/|$)">
    Require all denied
</DirectoryMatch>
