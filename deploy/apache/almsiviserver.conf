<VirtualHost *:@ALMSIVI_HTTP_PORT@>
    ServerName almsiviserver.local
    DocumentRoot /var/www/html
    Alias /ALMSIVIserver /var/www/ALMSIVIserver/current/public

    IncludeOptional /etc/almsiviserver/apache-env.conf

    <Directory /var/www/html>
        Options -Indexes -ExecCGI +FollowSymLinks
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/html/Dwemer-Dashboard>
        Options -Indexes -ExecCGI +FollowSymLinks
        AllowOverride None
        <RequireAny>
            Require local
            Require ip @WSL_GATEWAY@
        </RequireAny>
    </Directory>

    <Directory /var/www/ALMSIVIserver/current/public>
        Options -Indexes -ExecCGI +FollowSymLinks
        AllowOverride None
        <RequireAny>
            Require local
            Require ip @WSL_GATEWAY@
        </RequireAny>
        DirectoryIndex ui/home.php index.php

        RewriteEngine On
        RewriteBase /ALMSIVIserver/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L,QSA]
    </Directory>

    LimitRequestBody 33554432
    ErrorLog ${APACHE_LOG_DIR}/almsiviserver-error.log
    CustomLog ${APACHE_LOG_DIR}/almsiviserver-access.log combined
</VirtualHost>
