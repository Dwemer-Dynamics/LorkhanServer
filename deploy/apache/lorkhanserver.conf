<VirtualHost *:@LORKHAN_HTTP_PORT@>
    ServerName lorkhanserver.local
    DocumentRoot /var/www/html
    Alias /LorkhanServer /var/www/html/LorkhanServer

    IncludeOptional /etc/lorkhanserver/apache-env.conf

    <Directory /var/www/html>
        Options -Indexes -ExecCGI +FollowSymLinks
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/html/Dwemer-Dashboard>
        Options -Indexes -ExecCGI +FollowSymLinks
        AllowOverride None
        <RequireAny>
            Require local
            Require ip @WSL_GATEWAY@
        </RequireAny>
    </Directory>

    <Directory /var/www/html/LorkhanServer>
        Options -Indexes -ExecCGI +FollowSymLinks
        AllowOverride None
        <RequireAny>
            Require local
            Require ip @WSL_GATEWAY@
        </RequireAny>
        DirectoryIndex ui/home.php index.php

        RewriteEngine On
        RewriteBase /LorkhanServer/
        # Only UI assets/pages and the authenticated front-controller routes are public.
        RewriteRule ^(?!ui(?:/|$)|index\.php$|api/v1(?:/|$)|manage(?:/|$)|$) - [F,L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L,QSA]
    </Directory>

    # Only the confirmed SQL-upload endpoint needs a larger body; native API limits stay unchanged.
    <Location /LorkhanServer/manage/forms/database-import>
        LimitRequestBody 1074790400
        <IfModule php_module>
            php_admin_value upload_max_filesize 1024M
            php_admin_value post_max_size 1025M
        </IfModule>
    </Location>
    LimitRequestBody 33554432
    ErrorLog ${APACHE_LOG_DIR}/lorkhanserver-error.log
    CustomLog ${APACHE_LOG_DIR}/lorkhanserver-access.log combined
</VirtualHost>
