name: server

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  php-postgresql:
    name: PHP 8.3 and PostgreSQL 16
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install PHP and PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install --yes php-cli php-curl php-mbstring php-pgsql postgresql postgresql-client postgresql-16-pgvector
          pg_config --version
          php --version
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Lint PHP
        run: find lib ui conf tests scripts service processor connector tts stt prompts index.php -type f -name '*.php' -exec php -l {} \;
      - name: Validate local protocol manifest
        run: php scripts/protocol/verify-local.php
      - name: Run unit and provider contract checks
        run: php tests/run.php
      - name: Prepare strict response validation
        run: |
          python3 -m venv "$RUNNER_TEMP/response-validator"
          "$RUNNER_TEMP/response-validator/bin/python" -m pip install 'jsonschema[format]==4.23.0'
      - name: Run disposable PostgreSQL integration, migrations, jobs, and backup restore
        run: |
          LORKHAN_RESPONSE_CAPTURE="$RUNNER_TEMP/server-responses.jsonl" scripts/test/integration.sh
          "$RUNNER_TEMP/response-validator/bin/python" scripts/test/validate-responses.py "$RUNNER_TEMP/server-responses.jsonl"
      - name: Run management HTTP and CSRF workflows
        run: scripts/test/management-http-integration.sh
      - name: Record scope honestly
        if: always()
        run: |
          printf '%s\n' 'This job proves PHP, protocol, disposable PostgreSQL migration/integration, worker, backup/restore, and management HTTP behavior.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'It does not claim local WSL deployment, live provider credentials, or in-game behavior.' >> "$GITHUB_STEP_SUMMARY"
